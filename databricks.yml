bundle:
  name: airline-booking-lakehouse

include:
  - resources/*.yml

artifacts:
  default:
    type: whl
    build: python -m build --wheel
    dynamic_version: true

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}