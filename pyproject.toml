[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "airline-booking-lakehouse"
version = "0.1.0"
description = "A Databricks lakehouse for synthetic airline booking events."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pyspark==4.0.0",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
ingest-bronze = "airline_booking_lakehouse.bronze:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]